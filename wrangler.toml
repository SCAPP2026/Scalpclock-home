name = "scalpclock"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# KV namespace originally provisioned for the retired Chart Review feature
# (functions/api/chart-feedback.js, deleted) — now used by
# functions/api/sampsonx-chat.js instead, under a "chat:" key prefix so it
# never collides with any leftover Chart Review counters. Binding name kept
# as-is to avoid a second manual Cloudflare dashboard rebind.
# Must also be bound in the Cloudflare Pages dashboard (Settings → Functions
# → KV namespace bindings) for production — this entry only covers local
# `wrangler pages dev`.
[[kv_namespaces]]
binding = "CHART_FEEDBACK_KV"
id = "34e6e1c9f8a4452b80e756848db5eb3a"

# Secrets — set in Cloudflare dashboard → Settings → Environment variables
# Alpaca (market data):
#   ALPACA_KEY_ID, ALPACA_SECRET
# Anthropic (Ask Sampson X chat, functions/api/sampsonx-chat.js):
#   ANTHROPIC_API_KEY — sk-ant-... from console.anthropic.com; used with
#   model claude-sonnet-5, open to any logged-in user, gated only by the
#   KV caps above (not by plan — see that file's header comment)
# Stripe (payments):
#   STRIPE_SECRET_KEY         — sk_live_... from Stripe dashboard
#   STRIPE_WEBHOOK_SECRET     — whsec_... from Stripe webhook endpoint settings
#   STRIPE_PRICE_PRO_MONTHLY  — price_... for $19.99/mo product (raised from
#     $9.99/mo on 2026-09-21; existing subscribers grandfathered on the old
#     price, which stays active for renewals only — new price object is
#     price_1UI7PZIpxBaK009p0zJYRdmx, old is price_1TnRS5IpxBaK009pX71P4yB9)
#   STRIPE_PRICE_PRO_ANNUAL   — price_... for $199.00/yr product (~$16.58/mo,
#     raised from $99.00/yr on 2026-09-21, same grandfathering — new price
#     object is price_1UI7PgIpxBaK009pJvMTyjP5, old is
#     price_1Tnee4IpxBaK009prbOTbUmw)
#   STRIPE_PRICE_ELITE_MONTHLY — price_... (when Elite launches)
#   STRIPE_PRICE_ELITE_ANNUAL  — price_... (when Elite launches)
# News feeds (all optional — sources with no key are silently skipped):
#   POLYGON_KEY  — api.polygon.io key (also used for news endpoint)
#   FINNHUB_KEY  — finnhub.io key (free tier: 60 calls/min)
#   FMP_KEY      — financialmodelingprep.com key (free tier: 250 req/day)
#   BENZINGA_KEY — api.benzinga.com key (paid)
#   NEWSAPI_KEY  — newsapi.org key (free dev / paid prod)
#   TE_KEY       — api.tradingeconomics.com key (paid)
# Never commit actual values to source control.

