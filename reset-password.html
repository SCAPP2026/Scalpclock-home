<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 50% -5%,rgba(22,217,126,.08),transparent 68%),
  linear-gradient(var(--line) 1px,transparent 1px),
  linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:auto,48px 48px,48px 48px;}
.box{position:relative;z-index:1;width:100%;max-width:420px;}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;justify-content:center;margin-bottom:32px;}
.brand-text{display:flex;flex-direction:column;gap:2px;}
.brand-name{font-family:var(--disp);font-weight:700;font-size:1.45rem;letter-spacing:.02em;color:var(--text);line-height:1;}
.brand-name em{color:var(--green);font-style:normal;}

.b-mark{width:34px;height:34px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#1a2b22,#070a08);border:1px solid rgba(22,217,126,.55);box-shadow:0 0 18px rgba(22,217,126,.30);display:grid;place-items:center;flex-shrink:0;}
.b-mark svg{width:18px;height:18px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;
  box-shadow:var(--shadow-lg);}

.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
label{font-size:.82rem;color:var(--t65);font-weight:500;}

.msg{font-size:.83rem;padding:10px 14px;border-radius:8px;text-align:center;margin-bottom:8px;}
.error{background:rgba(197,35,35,.08);border:1px solid rgba(197,35,35,.3);color:var(--red-ink);}
.success{background:var(--green-soft);border:1px solid rgba(22,217,126,.35);color:var(--green-ink);}
.footer-note{text-align:center;margin-top:20px;font-size:.78rem;color:var(--t45);}
.footer-note a{color:var(--green-ink);text-decoration:none;}
.clock-svg .hand-min{transform-origin:9px 9px;animation:spin-min 6s linear infinite;}
.clock-svg .hand-sec{transform-origin:9px 9px;animation:spin-sec 1s linear infinite;}
@keyframes spin-min{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-sec{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Reset Your ScalpClock Password</h1>
<div class="box">
  <a class="brand" href="/">
    <div class="b-mark">
      <svg class="clock-svg" viewBox="0 0 18 18" fill="none" stroke="#16d97e" stroke-width="1.8" stroke-linecap="round">
        <circle cx="9" cy="9" r="7"/>
        <line class="hand-min" x1="9" y1="9" x2="9" y2="4.5"/>
        <line class="hand-sec" x1="9" y1="9" x2="12.5" y2="9"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">Scalp<em>Clock</em></span>
      <span class="brand-motto">The Time To Profit Is Now</span>
    </div>
  </a>

  <div class="card">
    <h2>Set a New Password</h2>
    <div id="msg"></div>

    <div id="reset-form" class="form" style="display:none">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="rp-pass" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="rp-pass2" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="rp-btn" onclick="updatePassword()" style="width:100%;margin-top:4px">Update Password</button>
    </div>

    <div id="invalid-link" class="form" style="display:none">
      <p style="font-size:.88rem;color:var(--t65);text-align:center">This reset link is invalid or has expired.</p>
      <a class="btn btn-ghost" href="/login" style="width:100%;text-align:center;text-decoration:none">Request a New Link</a>
    </div>
  </div>
  <p class="footer-note">&copy; 2026 VSLLC. All rights reserved. ScalpClock is a product of VSLLC.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://fnuqxiflqqejjttxymbz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZudXF4aWZscXFlamp0dHh5bWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzMxODksImV4cCI6MjA5ODAwOTE4OX0.XE1-LPW0043gRFEAl9onCahkmpQ8BMAAtGkF9FqJLiY';

let sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.warn('Supabase init failed:', e.message); }

function showMsg(text, type) {
  document.getElementById('msg').innerHTML = `<div class="msg ${type}">${text}</div>`;
}

// Supabase's recovery link puts the token in the URL hash; supabase-js
// parses it automatically on load and fires PASSWORD_RECOVERY. We gate the
// form on that event (rather than showing it immediately) so a direct visit
// to this page with no valid token shows the "invalid link" state instead.
let _recoveryReady = false;

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && session) {
    _recoveryReady = true;
    document.getElementById('reset-form').style.display = 'flex';
    document.getElementById('invalid-link').style.display = 'none';
  }
});

// If the hash was already consumed by the time onAuthStateChange listeners
// attached (e.g. bfcache restore), fall back to checking for a live session.
setTimeout(async () => {
  if (_recoveryReady) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    _recoveryReady = true;
    document.getElementById('reset-form').style.display = 'flex';
  } else {
    document.getElementById('invalid-link').style.display = 'flex';
  }
}, 1500);

async function updatePassword() {
  const pass  = document.getElementById('rp-pass').value;
  const pass2 = document.getElementById('rp-pass2').value;
  if (!pass || !pass2) return showMsg('Please fill in both fields.', 'error');
  if (pass.length < 6) return showMsg('Password must be at least 6 characters.', 'error');
  if (pass !== pass2) return showMsg('Passwords do not match.', 'error');
  const btn = document.getElementById('rp-btn');
  btn.disabled = true; btn.textContent = 'Updating...';
  const { error } = await sb.auth.updateUser({ password: pass });
  if (error) {
    showMsg(error.message, 'error');
    btn.disabled = false; btn.textContent = 'Update Password';
  } else {
    showMsg('Password updated! Redirecting to sign in...', 'success');
    document.getElementById('reset-form').style.display = 'none';
    setTimeout(() => { window.location.href = '/login'; }, 2000);
  }
}
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
